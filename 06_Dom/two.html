<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavScript on YouTube</title>
</head>
<body style ="background-color: #212121; color : #fff">

    <ul class ="language">
        <li>JavaScript</li>
    </ul>
    
</body> 
<script>
    //through of function create list
    function addLanguage(langName){
        const li = document.createElement('li')
        li.innerText = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
addLanguage("Python")
addLanguage("Ruby")

//Thoda Optimize tarike se 

function addOptiLanguage (langName){
    const li = document.createElement('li') 
    li.appendChild(document.createChildNode(langName).appendChild(li))
} 
addLanguage('Java')
addLanguage('CPP') 


// Edit (Replace, change) 

const secondLang = document.querySelector("li:nth-child(2)")
//console.log(secondLang)
//secondLang.innerHTML = "React Js" 
const newli = document.createElement('li')
newli.textContent = "React js"
secondLang.replaceWith(newli)

// ex 2  
 
const firstLang = document.querySelector("li:first-child")
firstLang.outerHTML = '<li>Python</li>' 

// Remove 
const lastLang = document.querySelector("li:last-child")
lastLang.remove() 

</script>
</html>
